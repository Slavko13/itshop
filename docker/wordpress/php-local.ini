display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
post_max_size=64M
upload_max_filesize=64M
sendmail_path="/usr/bin/msmtp -t"

; Windows bind mounts make stat() calls across WordPress and plugins costly.
; Keep source changes visible, but avoid rescanning thousands of PHP files on
; every request. Restarting the wordpress service always clears this cache.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.file_update_protection=0
realpath_cache_size=16M
realpath_cache_ttl=600
